version: '3.8'

services:
  fintrack-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-backend-prod
    ports:
      - "3001:3001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - DEBUG=False
      - PYTHONPATH=/app
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for production caching
  redis:
    image: redis:7-alpine
    container_name: fintrack-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: fintrack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - fintrack-api
    restart: unless-stopped

volumes:
  redis_prod_data: